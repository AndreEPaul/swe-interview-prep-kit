name: Guide, template, or example fix
description: A wrong or outdated claim, a broken link, or unclear wording
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the correction. If you would rather fix it yourself, a pull request is welcome, and a typo or a broken link can go straight there.
  - type: input
    id: where
    attributes:
      label: Where is it?
      description: The file and section, for example `guides/resume.md`, or a link to it.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear?
      description: If you know what it should say, say so. Tools and policies change, so a source and the date or version you checked help.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I left out private details such as resume text, employer names, and other people's names. See the [privacy rules](https://github.com/AndreEPaul/swe-interview-prep-kit/blob/main/CONTRIBUTING.md#privacy-rules).
          required: true
