name: Suggestion
description: New coverage, or a change to a guide, skill, or template
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Open-ended ideas also fit in [Discussions](https://github.com/AndreEPaul/swe-interview-prep-kit/discussions). Before you write this up, check what [fits and what is out of scope](https://github.com/AndreEPaul/swe-interview-prep-kit/blob/main/CONTRIBUTING.md#what-fits).
  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: case
    attributes:
      label: What case is it for?
      description: A real case helps most. Say what you were preparing for and where the kit fell short, and leave out private details.
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Helping out
      options:
        - label: I'd be glad to draft it and send a pull request.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I left out private details such as resume text, employer names, and other people's names. See the [privacy rules](https://github.com/AndreEPaul/swe-interview-prep-kit/blob/main/CONTRIBUTING.md#privacy-rules).
          required: true
