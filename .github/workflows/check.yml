name: check

on:
  push:
    branches: [main]
  pull_request:
  # draft-release.yml runs these same checks before it drafts a release.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the documented minimum and has no builds for Ubuntu 26.04, which ubuntu-latest now uses.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Repository checks without PyYAML (the checker needs no packages)
        run: python tools/check.py
      - name: Install PyYAML (stricter skill frontmatter parsing)
        run: python -m pip install pyyaml
      - name: Repository checks with PyYAML
        run: python tools/check.py
      - name: Checker tests
        run: python -m unittest discover -s tools -v

  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Third-party, so pinned to a commit. Dependabot keeps the pin current. Settings: .markdownlint-cli2.yaml
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  # The checks above read the final files. This one reads every commit in the pull request, so a leak that a later
  # commit deleted is still caught. It cannot see a private deny-list, which only a local run can use.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the commits in this pull request
        run: python tools/check.py --history "$BASE_SHA..$HEAD_SHA"
