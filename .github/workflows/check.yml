name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the documented minimum and has no builds for Ubuntu 26.04, which ubuntu-latest now uses.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Repository checks without PyYAML (the checker needs no packages)
        run: python tools/check.py
      - name: Install PyYAML (stricter skill frontmatter parsing)
        run: python -m pip install pyyaml
      - name: Repository checks with PyYAML
        run: python tools/check.py
      - name: Checker tests
        run: python -m unittest discover -s tools -v

  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Third-party, so pinned to a commit. Dependabot keeps the pin current. Settings: .markdownlint-cli2.yaml
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
