name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Repository checks without PyYAML (the checker needs no packages)
        run: python tools/check.py
      - name: Install PyYAML (stricter skill frontmatter parsing)
        run: python -m pip install pyyaml
      - name: Repository checks with PyYAML
        run: python tools/check.py
      - name: Checker tests
        run: python -m unittest discover -s tools -v
