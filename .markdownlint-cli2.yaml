# Markdown style for swe-interview-prep-kit. Run it with: npx markdownlint-cli2 "**/*.md"
gitignore: true
config:
  default: true
  # Each paragraph is one line, so wrapping at 80 columns would only add diff noise.
  MD013: false
  # Collapsible sections use <details> and <summary>. No other inline HTML is allowed.
  MD033:
    allowed_elements: [details, summary]
ignores:
  # A one-line `@AGENTS.md` import for Claude Code, not a document.
  - CLAUDE.md
  # Fills in a pull request description, so it starts at level 2 instead of with a page title.
  - .github/PULL_REQUEST_TEMPLATE.md
